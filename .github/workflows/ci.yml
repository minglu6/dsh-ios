name: ci
on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Run simulator screenshots and keyboard/IME UI tests
        type: boolean
        default: false
      ui_scope:
        description: UI verification scope
        type: choice
        options: [full, settings-trajectory, session-header, pagination, conversation, reading]
        default: full

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  protocol:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Protocol tests
        run: swift test --package-path protocol

  ios:
    needs: [protocol]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project app/dsh.xcodeproj \
            -scheme dsh \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build
          APP="derived/Build/Products/Release-iphoneos/dsh.app"
          test -d "$APP"
          test -f "$APP/CodePreviewAssets/manifest.json"
          test -f "$APP/WorkbookPreviewAssets/manifest.json"
          rm -rf Payload dsh-ios.ipa
          mkdir Payload
          ditto "$APP" Payload/dsh.app
          zip -qr dsh-ios.ipa Payload
          ls -lh dsh-ios.ipa
          unzip -tq dsh-ios.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-ios
          path: dsh-ios.ipa
          compression-level: 0
      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dsh-ios-latest
          git push -f origin dsh-ios-latest
          gh release view dsh-ios-latest >/dev/null 2>&1 || gh release create dsh-ios-latest --prerelease --title "dsh-ios (latest)" --notes "Rolling build."
          notes="Rolling unsigned IPA @ ${GITHUB_SHA::7}. Sign with 轻松签 (or any sideload signer) before install. Phone talks to dsh-plugin-pocket over LAN/Tailscale WebSocket — install the Host plugin from https://github.com/minglu6/dsh-android."
          gh release edit dsh-ios-latest --notes "$notes"
          gh release upload dsh-ios-latest dsh-ios.ipa --clobber

  screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui_tests
    needs: [protocol]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Boot iPhone simulator
        run: |
          set -euo pipefail
          # KeyboardDismissalTests need the software keyboard, not a hardware
          # keyboard that leaves app.keyboards empty.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcodebuild -version
          DEVICE=$(python3 - <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          prefer = None
          first = None
          for runtime, devices in data.get("devices", {}).items():
              runtime_l = runtime.lower()
              if "ios" not in runtime_l and "iphoneos" not in runtime_l:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  udid = device.get("udid")
                  if not name.startswith("iPhone") or not udid:
                      continue
                  if first is None:
                      first = {"udid": udid, "state": device.get("state")}
                  if name == "iPhone 17e":
                      prefer = {"udid": udid, "state": device.get("state")}
          chosen = prefer or first
          if not chosen:
              sys.exit("no available iPhone simulator")
          udid = chosen["udid"]
          state = chosen["state"]
          if state == "Shutdown":
              subprocess.check_call(["xcrun", "simctl", "boot", udid])
          elif state not in ("Booted", "Booting"):
              sys.exit(f"simulator {udid} is {state}")
          print(udid)
          PY
          )
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: XCUITest screenshots
        env:
          DSH_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
          UI_SCOPE: ${{ inputs.ui_scope }}
        run: |
          set -euo pipefail
          mkdir -p "$DSH_SCREENSHOT_DIR"
          export DSH_SCREENSHOT_DIR
          export TEST_RUNNER_DSH_SCREENSHOT_DIR="$DSH_SCREENSHOT_DIR"
          if [ "$UI_SCOPE" = "settings-trajectory" ]; then
            export TEST_RUNNER_DSH_SCREENSHOT_SCREENS="settingsShell,settings"
            UI_TESTS=(
              -only-testing:dshUITests/ScreenshotTests/testLightScreenshots
              -only-testing:dshUITests/ScreenshotTests/testDarkScreenshots
              -only-testing:dshUITests/TrajectoryUITests
            )
            MIN_SCREENSHOTS=4
          elif [ "$UI_SCOPE" = "session-header" ]; then
            UI_TESTS=(-only-testing:dshUITests/SessionHeaderUITests)
            MIN_SCREENSHOTS=4
          elif [ "$UI_SCOPE" = "conversation" ]; then
            export TEST_RUNNER_DSH_SCREENSHOT_SCREENS="landing"
            UI_TESTS=(
              -only-testing:dshUITests/SessionTitleUITests
              -only-testing:dshUITests/TurnNavigationUITests
              -only-testing:dshUITests/TrajectoryUITests
              -only-testing:dshUITests/ScreenshotTests/testLightScreenshots
              -only-testing:dshUITests/ScreenshotTests/testDarkScreenshots
              -only-testing:dshUITests/HistoryPagingUITests/testChatPullsConsecutivePagesAndStopsAtEnd
              -only-testing:dshUITests/HistoryPagingUITests/testChatFailedPullCanRetryWithoutLosingContent
            )
            MIN_SCREENSHOTS=4
          elif [ "$UI_SCOPE" = "reading" ]; then
            export TEST_RUNNER_DSH_SCREENSHOT_SCREENS="landing"
            UI_TESTS=(
              -only-testing:dshUITests/ScreenshotTests/testLightScreenshots
              -only-testing:dshUITests/ScreenshotTests/testDarkScreenshots
              -only-testing:dshUITests/HistoryPagingUITests/testChatPullsConsecutivePagesAndStopsAtEnd
              -only-testing:dshUITests/TurnNavigationUITests/testOlderHostOnlyShowsLoadedRealIdentitiesAndPullRefreshAddsEarlierTurn
            )
            MIN_SCREENSHOTS=2
          elif [ "$UI_SCOPE" = "pagination" ]; then
            UI_TESTS=(
              -only-testing:dshUITests/HistoryPagingUITests
              -only-testing:dshUITests/SessionDrawerPagingUITests
            )
            MIN_SCREENSHOTS=8
          else
            UI_TESTS=(
              -only-testing:dshUITests/ScreenshotTests
              -only-testing:dshUITests/KeyboardDismissalTests
              -only-testing:dshUITests/ComposerImeTests
              -only-testing:dshUITests/SessionHeaderUITests
              -only-testing:dshUITests/WorkspaceChangesUITests
              -only-testing:dshUITests/CodePreviewUITests
              -only-testing:dshUITests/TrajectoryUITests
              -only-testing:dshUITests/HistoryPagingUITests
              -only-testing:dshUITests/SessionDrawerPagingUITests
              -only-testing:dshUITests/TodoLifecycleUITests
              -only-testing:dshUITests/JobsLifecycleUITests
              -only-testing:dshUITests/SessionTitleUITests
              -only-testing:dshUITests/TurnNavigationUITests
            )
            MIN_SCREENSHOTS=20
          fi
          xcodebuild \
            -project app/dsh.xcodeproj \
            -scheme dsh \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DEVICE}" \
            -derivedDataPath derived-ui \
            "${UI_TESTS[@]}" \
            -resultBundlePath derived-ui/dsh-screenshots.xcresult \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            test
          find "$DSH_SCREENSHOT_DIR" -maxdepth 1 -name '*.png' | sort
          test "$(find "$DSH_SCREENSHOT_DIR" -maxdepth 1 -name '*.png' | wc -l)" -ge "$MIN_SCREENSHOTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: screenshots
          if-no-files-found: warn
